[project]
name = "study-ai-assistant-helper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
]

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
study-ai-assistant-helper = "study_ai_assistant_helper:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

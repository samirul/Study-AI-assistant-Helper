[project]
name = "study-ai-assistant-helper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.162.0",
    "google-auth==2.62.0",
    "google-genai==2.31.0",
    "groq==0.37.1",
    "langchain==1.4.5",
    "langchain-core==1.6.10",
    "langchain-google-genai==4.4.2",
    "langchain-groq==1.1.3",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.7.1",
    "langchain-pinecone==0.2.13",
    "langchain-protocol==0.0.19",
    "langchain-text-splitters==1.1.3",
    "langgraph==1.2.15",
    "langgraph-checkpoint==4.3.0",
    "langgraph-prebuilt==1.1.0",
    "langgraph-sdk==0.4.7",
    "langsmith==0.14.8",
    "numpy==2.5.4",
    "ollama==0.6.3",
    "openai==3.31.0",
    "opencv-python==5.0.0.93",
    "pillow==12.3.0",
    "pinecone==7.3.0",
    "pinecone-plugin-assistant==1.8.0",
    "pinecone-plugin-interface==0.0.7",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pypdf==6.20.1",
    "pytesseract==0.3.13",
    "python-dotenv==1.2.4",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "sqlalchemy[asyncio]>=2.0.14",
    "sqlmodel>=0.0.49",
    "starlette[full]>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
study-ai-assistant-helper = "study_ai_assistant_helper:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
